<!DOCTYPE html>
<html>
    <head>
        <title>Tugas Link - Gambar Ber-link</title>
    </head>
    <body>
        <h2>Tugas Link</h2>
        <p>Klik gambar di bawah ini untuk menuju ke Google:</p>

        <!-- Menjadikan gambar sebagai link ke Google -->
        <a href="http://www.google.com" target="_blank">
            <img src="img/google.png" alt="Logo/Gambar Google" width="200">
        </a>
    </body>
</html>
